<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Planner">
<meta name="theme-color" content="#A9C3C2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<title>Mi Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: chic, femenina y con actitud
   IDEA: una libreta de tapa animal print con elástico rosado, sobre un escritorio verde agua
   PICTURE: el librito: tapa leopardo, hojas crema, anillos rosados, pestañas rosa, agua y leopardo
   COLOUR and TYPE: verde agua, crema, rosa fucsia, leopardo y cebra; Playfair Display + Caveat + DM Sans
   LAYOUT: dos hojas con anillos y pestañas a la derecha; en el celular una hoja bajo la otra */
:root{color-scheme:light;--desk:#A9C3C2;--pg:#FBF5F2;--sf:#F4E6E7;--sf2:#EED8DC;--ink:#3A2C2E;--mu:#7A6669;--dim:#A6918F;--ln:rgba(58,44,46,.12);
--oro:#C93D72;--oro2:#F3B3C7;--plata:#C9CCD3;--rosa:#E8B4BC;--cielo:#A9D6E5;--mant:#F5E3A3;--salvia:#B5C9A8;--lila:#C9B6E4;--dk:#2B1F21;
--gold:linear-gradient(135deg,#E27BA1 0%,#F8D3DF 42%,#E05C8C 70%,#F5BACB 100%)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif;overflow-x:clip}
body{background:radial-gradient(ellipse at 50% 30%,#B9D0CF 0%,var(--desk) 70%) fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;outline:none}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:6px}
.goldt{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{padding:calc(28px + env(safe-area-inset-top)) 90px calc(110px + env(safe-area-inset-bottom)) 28px;display:flex;justify-content:center}
/* portada */
.cover{position:relative;width:min(560px,100%);aspect-ratio:600/820;margin:10px auto;border-radius:10px 26px 26px 10px;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.07),transparent 55%),radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.5px) 0 0/5px 5px,#0B0B0B;box-shadow:8px 8px 0 #F1E6E3,14px 14px 0 #E2D2CF,0 30px 60px rgba(40,60,60,.35);display:grid;place-items:center}
.cover:before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;border-radius:10px 0 0 10px;background:linear-gradient(90deg,#070707,#141414)}
.band{position:absolute;right:64px;top:0;bottom:0;width:16px;background:var(--gold)}
.studs{position:absolute;left:40px;right:24px;display:flex;justify-content:space-between}.studs i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#B9BEC6 45%,#5E636B)}
.stitch{position:absolute;inset:14px 14px 14px 36px;border:1.5px dashed rgba(201,61,114,.25);border-radius:6px 18px 18px 6px;pointer-events:none}
.plate{position:relative;width:72%;padding:40px 24px 34px;border-radius:6px;border:2px solid var(--oro);background:#121212;box-shadow:0 0 0 6px #0B0B0B,0 0 0 7px rgba(201,61,114,.35);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.plate .k{font-size:12px;letter-spacing:.32em;color:var(--mu)}
.plate h1{margin:0;font:400 clamp(64px,12vw,104px)/.88 'Bebas Neue',sans-serif;letter-spacing:.02em}
.plate .de{font:400 30px 'Permanent Marker',cursive;color:var(--rosa);transform:rotate(-4deg);margin-top:4px}
.plate hr{width:110px;border:0;height:1px;background:var(--oro);opacity:.5;margin:10px 0}
.open{margin-top:18px;min-height:44px;padding:0 22px;border-radius:999px;background:#C93D72;color:#fff;font-weight:700;font-size:14px}
/* libro */
.book{position:relative;width:min(1250px,100%);display:flex;align-items:stretch}
.pg{position:relative;flex:1;min-height:780px;padding:44px 50px;background-color:var(--pg);background-image:radial-gradient(rgba(58,44,46,.13) 1px,transparent 1.2px);background-size:22px 22px;display:flex;flex-direction:column;gap:18px}
.pg.l{border-radius:20px 6px 6px 20px;box-shadow:-6px 6px 0 #EADCDB,-10px 10px 0 #DCC9C8,0 20px 40px rgba(60,70,70,.25)}
.pg.r{border-radius:6px 20px 20px 6px;box-shadow:6px 6px 0 #EADCDB,10px 10px 0 #DCC9C8,0 20px 40px rgba(60,70,70,.25)}
.pg.l:after,.pg.r:after{content:"";position:absolute;top:0;bottom:0;width:60px;pointer-events:none}
.pg.l:after{right:0;background:linear-gradient(90deg,transparent,rgba(120,80,90,.16))}
.pg.r:after{left:0;background:linear-gradient(90deg,rgba(120,80,90,.16),transparent)}
.rings{position:absolute;left:50%;top:80px;bottom:80px;transform:translateX(-50%);display:flex;flex-direction:column;justify-content:space-between;z-index:3;pointer-events:none}
.rings i{width:46px;height:16px;border-radius:8px;border:3px solid #D79AA6;box-shadow:0 2px 0 rgba(90,50,60,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.tabs{position:absolute;right:-60px;top:100px;display:flex;flex-direction:column;gap:8px;z-index:4}
.tabs button{width:54px;height:104px;border-radius:0 14px 14px 0;background:var(--c);color:var(--dk);font-size:12px;font-weight:700;letter-spacing:.08em;writing-mode:vertical-rl;box-shadow:4px 4px 0 rgba(0,0,0,.3);transition:width .2s}
.tabs button.on{width:64px}
.tabs .home{height:64px;background:var(--gold);writing-mode:horizontal-tb;display:grid;place-items:center}.tabs .home.on{width:64px}
.kick{font-size:11px;letter-spacing:.22em;color:var(--mu);font-weight:500}
.ttl{margin:2px 0 0;font:italic 500 clamp(36px,4.4vw,50px)/1 'Playfair Display',Georgia,serif;color:var(--c,var(--oro))}
.nav{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mu)}
.nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--c,var(--oro))}
.nav button:hover{background:var(--sf)}
.nav .hoy{width:auto;padding:0 12px;height:30px;border-radius:999px;border:1px solid var(--ln);font-size:12px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{min-height:34px;padding:0 14px;border-radius:999px;font-size:12px;font-weight:500;color:var(--c);border:1px solid rgba(58,44,46,.18);display:inline-flex;align-items:center;gap:6px}
.pills button.on{background:var(--c);color:var(--dk);border-color:var(--c)}
.pills i{width:8px;height:8px;border-radius:50%;background:var(--d,var(--c))}
.pills button.on i{background:var(--dk)}
h2{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.2em}
h2 i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--oro))}
.sec{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--ln)}
.row input[type=text]{flex:1;padding:6px 0}
.lined{width:100%;resize:vertical;min-height:110px;line-height:34px;background-image:repeating-linear-gradient(transparent 0 33px,var(--ln) 33px 34px);padding:0}
.hand{font-family:'Caveat',cursive;font-size:24px}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--c,var(--oro));border-radius:5px;flex:none;display:grid;place-items:center;cursor:pointer;margin:0}
.chk:checked{background:var(--c,var(--oro))}
.chk:checked::after{content:"";width:8px;height:4px;border:2px solid var(--dk);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done{text-decoration:line-through;color:var(--mu)}
.x{width:32px;height:32px;border-radius:50%;color:var(--dim);display:grid;place-items:center;flex:none;opacity:.6}
.x:hover{opacity:1;background:var(--sf);color:var(--oro)}
.add{color:var(--mu)}.add::placeholder{color:var(--dim)}
.tm{font-size:12px;color:var(--mu);white-space:nowrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:5px;background:var(--c);color:var(--dk);white-space:nowrap}
.empty{color:var(--mu);font-size:14px;margin:6px 0}
.hint{font-size:12px;color:var(--mu);display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(201,61,114,.07)}
.quote{font:italic 500 26px/1.2 'Playfair Display',Georgia,serif;margin:auto 0 0}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{font-size:11px;font-weight:700;color:var(--mu);text-align:center;padding-bottom:8px}
.cell{aspect-ratio:1/1.05;margin:3px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;color:var(--ink);transition:background .15s}
.cell:hover{background:var(--sf)}
.cell.out{color:var(--dim)}
.cell.td .n{background:#C93D72;color:#fff;font-weight:700;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.cell.sel{background:var(--sf2);box-shadow:inset 0 0 0 1.5px var(--oro)}
.dots{display:flex;gap:4px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.addf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;background:var(--sf);border-radius:14px}
.addf input[type=time]{width:120px}
.tpick{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1.5px solid #E7B9C9;background:#fff;color:#C93D72;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer}
.tpick.has{background:#C93D72;color:#fff;border-color:#C93D72}
.tpick svg{width:16px;height:16px}
.tpick input{position:absolute!important;inset:0;width:100%!important;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;border:0}
.addf input[type=text]{flex:1 1 180px;padding:6px 0;border-bottom:1px solid var(--ln)}
.btn{min-height:38px;padding:0 18px;border-radius:999px;background:#C93D72;color:#fff;font-weight:700;font-size:13px}
.it{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--ln)}
.it .t{flex:1;padding:6px 0}
.it .hr{width:46px;flex:none;font-size:13px;font-weight:700;color:var(--c)}
.bell{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--oro);flex:none}
.bell:hover{background:var(--sf)}
.daytl{font:700 46px/.95 'Caveat',cursive}
/* listas especiales */
.st{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;background:rgba(243,236,234,.08)}
.st.s1{background:var(--lila);color:var(--dk)}.st.s2{background:var(--salvia);color:var(--dk)}
.card{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:12px;text-align:left;width:100%}
.card.on{background:var(--sf)}
.card .bar{width:4px;height:28px;border-radius:2px;background:var(--c)}
.card span.tt{flex:1;font-size:14px}
.frag{font:italic 400 22px/1.4 'Playfair Display',Georgia,serif;color:#B8577A;width:100%;resize:vertical;min-height:110px}
.moods{display:flex;gap:14px;flex-wrap:wrap}
.mood{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mu)}
.mood i{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--c)}
.mood.on{color:var(--ink)}.mood.on i{background:var(--c);box-shadow:0 0 0 3px var(--pg),0 0 0 5px var(--c)}
.goal{background:var(--sf);border-radius:14px;padding:14px 16px;border-top:3px solid var(--c);display:flex;flex-direction:column;gap:4px}
.goal .gt{font-size:16px;font-weight:700;flex:1;padding:4px 0}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu)}
.prog .b{flex:1;height:5px;border-radius:3px;background:rgba(243,236,234,.12)}.prog .b i{display:block;height:5px;border-radius:3px;background:var(--c)}
.hw{display:flex}
.hbw{width:28px;height:38px;display:grid;place-items:center;flex:none}
.hb{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--c)}
.hb.on{background:var(--c)}
/* capas */
#ink{position:absolute;left:0;top:0;pointer-events:none;z-index:6}
body.pen #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
#stk{position:absolute;inset:0;pointer-events:none;z-index:5}
#stk.hidestk .s:not(.isph){display:none}
.s{position:absolute;user-select:none;-webkit-user-select:none;line-height:0}
body.stk .s{pointer-events:auto;cursor:grab;touch-action:none}
.s.sel{outline:2px dashed var(--oro);outline-offset:4px;border-radius:8px}
.pill{line-height:1;font:700 22px 'Caveat',cursive;padding:6px 14px;border-radius:999px;color:var(--dk);background:var(--c);white-space:nowrap;display:inline-block}
.ph{margin:0;width:180px;line-height:0;position:relative}
.ph img{width:100%;display:block;pointer-events:none}
.f-pol{background:#FAF6F4;padding:8px 8px 0;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.f-pol figcaption{font:700 21px/1.1 'Caveat',cursive;color:#231C1E;text-align:center;min-height:38px;padding:8px 4px}
.f-washi img,.f-sim img{border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.f-sim img{border-radius:14px}
.f-oro img{border:6px solid #E4709A;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.f-cir img{border-radius:50%;aspect-ratio:1;object-fit:cover;border:4px solid #E4709A;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.ph .tp{position:absolute;top:-10px;left:50%;width:76px;height:22px;background:rgba(201,61,114,.75);transform:translateX(-50%) rotate(-4deg)}
.ph.miss{height:140px;background:var(--sf);border-radius:10px}
/* herramientas */
.tools{position:fixed;right:20px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{display:flex;gap:6px;background:#FFF8F7;border:1px solid rgba(201,61,114,.3);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.fab button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--oro)}
.fab button:hover{background:var(--sf)}
.fab button.on{background:var(--gold);color:var(--dk)}
.panel{background:#FFF8F7;border:1px solid rgba(201,61,114,.3);border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:min(380px,calc(100vw - 32px))}
.panel .lbl{font-size:12px;color:var(--mu);margin:0 0 8px}
.tl{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--ln);font-size:12px}
.tl.on{border-color:var(--oro);color:var(--oro)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c)}
.sw.on{box-shadow:0 0 0 2px #FFF8F7,0 0 0 4px var(--oro)}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-height:250px;overflow:auto;margin-top:10px}
.tray button{height:56px;border-radius:10px;display:grid;place-items:center;background:var(--sf)}
.tray .pill{font-size:15px;padding:4px 8px}
.cap{width:100%;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--sf);font-size:14px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--gold);color:var(--dk);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:30;max-width:90vw}
.tabs button span{background:rgba(255,250,248,.92);color:var(--dk);padding:8px 3px;border-radius:6px}
.tabs [data-v=tra]{background:var(--leo) 0 0/70px 70px}
.tabs [data-v=cua]{background:var(--zeb) 0 0/42px 42px}
.tabs .home{background:var(--zeb) 0 0/48px 48px}.tabs .home svg{background:#FBF5F2;border-radius:50%;padding:5px;width:34px;height:34px;box-shadow:0 1px 3px rgba(0,0,0,.2)}.tabs .home svg path{fill:#C93D72}
.cover{background:var(--zc) center/cover no-repeat!important}
.cover .plate{background:none!important;border:0!important;box-shadow:none!important;width:86%!important}
.cover .plate h1,.cover .plate .de{text-shadow:-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,2px 2px 0 #fff,0px -2px 0 #fff,0px 2px 0 #fff,-2px 0px 0 #fff,2px 0px 0 #fff,0 4px 8px rgba(40,20,15,.3)!important}
.cover .plate .k{color:#E4709A!important;font-weight:700;text-shadow:0 1px 3px rgba(40,20,15,.4)}
.cover .plate .k{color:#7A6669}
.cover .plate h1{font:italic 500 clamp(56px,10vw,88px)/1 'Playfair Display',Georgia,serif!important;color:#C93D72;letter-spacing:0!important}
.cover .plate .de{font:700 38px 'Caveat',cursive!important;color:#C93D72!important}
.cover .band{background:linear-gradient(90deg,#D9467A,#F3B3C7,#D9467A)!important}

.cshelf{margin-bottom:8px}.cst{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--c);margin:6px 0 10px}.cst i{width:18px;height:4px;border-radius:2px;background:var(--c)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:20px}
.nb{position:relative;aspect-ratio:3/4;border-radius:4px 12px 12px 4px;overflow:hidden;box-shadow:4px 6px 14px rgba(60,40,40,.25);display:block;width:100%}
.nb .cv{position:absolute;inset:0}
.nb .sp{position:absolute;left:0;top:0;bottom:0;width:14%;background:var(--sp);z-index:1}
.nb .strap{position:absolute;right:0;top:40%;width:26%;height:16%;background:var(--st);border-radius:6px 0 0 6px;z-index:2;display:grid;place-items:center;box-shadow:-1px 1px 3px rgba(0,0,0,.2)}.nb .strap i{width:38%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.28)}
.nb .lb{position:absolute;left:20%;right:8%;bottom:9%;z-index:2;background:rgba(251,245,242,.94);border-radius:6px;padding:3px 6px;font:700 17px/1.2 'Caveat',cursive;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb.on{outline:3px solid var(--oro);outline-offset:3px}
.nb.add{border:2px dashed rgba(201,61,114,.45);box-shadow:none;background:transparent;display:grid;place-items:center;color:var(--oro);font-size:36px;font-weight:300}
.covs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.note{background:#fff;border-radius:12px;padding:8px 12px 10px;box-shadow:0 2px 8px rgba(60,40,40,.08);display:flex;flex-direction:column;gap:2px}
.note textarea{font:600 22px/1.3 'Caveat',cursive;width:100%;resize:vertical;min-height:38px}
.notes{display:flex;flex-direction:column;gap:10px}
.qn{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;background:var(--sf);border-radius:14px}
.qn textarea{flex:1;font:600 22px/1.3 'Caveat',cursive;min-height:44px;resize:vertical}
.nbtools{display:flex;gap:6px;flex-wrap:wrap}
.nbtools button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;min-height:52px;padding:6px 8px;border-radius:12px;font-size:11px;color:var(--mu);background:rgba(255,255,255,.7);border:1px solid var(--ln)}
.nbtools button:hover,.nbtools button.on{color:var(--oro);border-color:var(--oro)}
.nbtools svg{color:var(--oro)}
.bgs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.bgs button{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--mu)}
.bgs i{display:block;width:100%;aspect-ratio:3/4;border-radius:8px;border:1px solid var(--ln)}
.bgs button.on i{outline:3px solid var(--oro);outline-offset:2px}
.note .chkl{display:flex;flex-direction:column}
.note .chkl .row{min-height:34px}
.note a.lk{color:var(--oro);font-weight:500;word-break:break-all}
.note audio{width:100%;margin-top:4px}
.note .nt{font:700 15px 'DM Sans',sans-serif;width:100%;padding:2px 0}
.login{width:min(420px,100%);margin:6vh auto;background:var(--pg);border-radius:20px;padding:34px 30px;box-shadow:0 20px 40px rgba(60,70,70,.25);display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font:italic 500 40px/1 'Playfair Display',Georgia,serif;color:var(--oro)}
.login label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.login input{font-size:16px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--ln)}
.login .err{color:#B3261E;font-size:13px;min-height:18px}
.rec{background:#C93D72!important;color:#fff!important}.rec svg{color:#fff!important}
.nbs{display:flex;flex-direction:column;gap:12px}
.nbg{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.nbg>b{width:100%;font-size:11px;letter-spacing:.16em;color:var(--c)}
.nbi{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.nbi .nb{width:56px}
.nbi span{font:600 15px/1.1 'Caveat',cursive;color:var(--ink);text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbi .nb.add{font-size:24px;border-width:1.5px}
.an{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.65);margin-bottom:6px}
.an>i{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.an .sn{flex:1;font:600 20px/1.2 'Caveat',cursive;color:var(--ink)}
.an .tg{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--c);display:block}
@media(max-width:860px){
 .wrap{padding:env(safe-area-inset-top) 12px calc(120px + env(safe-area-inset-bottom))}
 .book{flex-direction:column;padding-top:64px}
 .pg{flex:none;min-height:0;padding:28px 22px;border-radius:18px!important;box-shadow:none!important}
 .pg:after{display:none}
 .pg.r{margin-top:14px}
 .rings{display:none}
 .tabs{position:absolute;right:auto;left:0;top:0;flex-direction:row;gap:6px;width:100%;overflow-x:auto}
 .tabs button{writing-mode:horizontal-tb;width:auto;height:44px;padding:0 14px;border-radius:0 0 12px 12px;flex:none}
 .tabs button.on{width:auto;height:52px}
 .tabs .home{width:44px}
 input,textarea{font-size:16px}
 .hand{font-size:24px}
 .tools{right:12px;bottom:12px}
}

/* hoja de cuaderno */
.panel{position:relative}
.panel .px{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#F6E3E8;color:#8E2A55;z-index:1}
.panel .px svg{width:16px;height:16px}
.panel .lbl{padding-right:40px}
.book.sheetmode{flex-direction:column}
.book.sheetmode .rings{display:none}
.shtop{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding-right:70px}
.shtop .bk{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 16px 0 10px;border-radius:999px;background:rgba(255,255,255,.75);color:var(--ink);font-weight:600;font-size:14px;flex:none}
.shtop .nbm{width:44px;flex:none}
.shtop .ttl{flex:1;min-width:0;font:italic 400 38px/1.1 'Playfair Display',serif;color:var(--c);padding:0}
.nsheet{--lh:40px;position:relative;width:100%;min-height:calc(100vh - 170px);border-radius:6px 18px 18px 6px;box-shadow:0 10px 30px rgba(40,60,60,.25),inset 14px 0 0 rgba(201,61,114,.08);background-color:#F8F3EF;background-image:linear-gradient(90deg,transparent 88px,rgba(201,61,114,.38) 88px 90px,transparent 90px),repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),#DCCFD1 calc(var(--lh) - 1px) var(--lh));background-position:0 0,0 66px;display:flex;flex-direction:column;transform-origin:top center}
.nsheet.anim{animation:unfold .55s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{transform:perspective(1400px) rotateX(-75deg) scaleY(.4);opacity:0}to{transform:none;opacity:1}}
.nsheet .tape{position:absolute;top:-8px;left:50%;width:130px;height:30px;margin-left:-65px;background:repeating-linear-gradient(45deg,rgba(242,182,201,.8) 0 8px,rgba(255,255,255,.65) 8px 16px);transform:rotate(-2deg);z-index:1}
.nsheet .date{position:absolute;top:24px;right:28px;font:700 11px 'DM Sans',sans-serif;letter-spacing:.2em;color:var(--mu)}
.nsheet .body{flex:1;padding:66px 26px 20px 104px;display:flex;flex-direction:column}
.nsheet .ln{position:relative}
.nsheet textarea.hw{display:block;width:100%;font:500 27px/40px 'Caveat',cursive;color:var(--ink);background:transparent;border:0;resize:none;padding:0 34px 0 0;margin:0;overflow:hidden}
.nsheet .ln .x{position:absolute;top:6px;right:0;opacity:.45}
.nsheet .shcard{margin:6px 0;background:rgba(255,255,255,.78);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.nsheet .write{flex:1;display:flex;flex-direction:column}
.nsheet .write textarea.hw{flex:1;min-height:160px;padding-right:0}
.nsheet .savew{align-self:flex-end;margin:4px 0 0}
.shbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:7;margin:10px 12px 12px;padding:8px;border-radius:18px;background:rgba(255,248,247,.96);border:1px solid rgba(201,61,114,.22);box-shadow:0 8px 24px rgba(60,40,40,.18);display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.shbar button{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;min-height:54px;padding:6px 8px;border-radius:12px;font-size:12px;color:var(--mu)}
.shbar button svg{color:var(--oro)}
.shbar button.on,.shbar button.rec{color:#C93D72;background:#FBE4EB}
body.sheet .tools .fab{display:none}
body.sheet .tools{bottom:calc(120px + env(safe-area-inset-bottom))}
@media(max-width:860px){.book.sheetmode{padding-top:64px}.nsheet .body{padding-left:72px}.nsheet{background-image:linear-gradient(90deg,transparent 58px,rgba(201,61,114,.38) 58px 60px,transparent 60px),repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),#DCCFD1 calc(var(--lh) - 1px) var(--lh))}.shtop{padding-right:0}.shtop .ttl{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.nsheet.anim{animation:none}}

function mrg(a,b){if(b===undefined||b===null||b==='')return a===undefined?b:a;
 if(Array.isArray(a)&&Array.isArray(b)){const idd=x=>x&&typeof x==='object'&&x.id!=null;if(a.every(idd)&&b.every(idd)){const out=b.map(x=>{const r=a.find(y=>y.id===x.id);return r?mrg(r,x):x});for(const y of a)if(!b.some(x=>x.id===y.id))out.push(y);return out}return b.length?b:a}
 if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){const o=Object.assign({},a);for(const k in b)o[k]=(k in a)?mrg(a[k],b[k]):b[k];return o}
 return b}
function load(k){if(S.cache[k])return Promise.resolve(S.cache[k]);if(S.loading[k])return S.loading[k];
 S.loading[k]=(async()=>{let v=lsGet(k)||{};if(S.online){try{const r0=await rget(k);if(r0){const r=JSON.parse(JSON.stringify(r0));S.base[k]=1;if((r._t||0)>=(v._t||0))v=r;else{v=mrg(r,v);setTimeout(()=>flush(k),50)}}else{S.base[k]=1;if(v._t)setTimeout(()=>flush(k),50)}}catch(e){}}
  S.cache[k]=v;lsSet(k,v);delete S.loading[k];return v})();return S.loading[k]}

function save(k){const v=C(k);v._t=Date.now();lsSet(k,v);clearTimeout(S.timers[k]);S.timers[k]=setTimeout(()=>flush(k),700)}
async function flush(k){if(!S.online)return;if(S.writing[k]){S.dirty[k]=true;return}S.writing[k]=true;
 if(!S.base[k]){try{const r=await rget(k);if(r)Object.assign(C(k),mrg(r,C(k)));S.base[k]=1;lsSet(k,C(k))}catch(e){S.writing[k]=false;setTimeout(()=>flush(k),2000);return}}
 try{await rset(k,JSON.parse(JSON.stringify(C(k))))}catch(e){S.fails=(S.fails||0)+1;if(S.fails===2)toast('No se pudo guardar en la nube. Revisa tu internet; lo intento de nuevo.');setTimeout(()=>flush(k),3000+Math.random()*2000)}
 S.writing[k]=false;if(S.dirty[k]){S.dirty[k]=false;flush(k)}}

 for(const k of Object.keys(S.cache)){if(S.writing[k]||S.timers[k]&&S.dirty[k])continue;try{const r=await rget(k);if(r&&(r._t||0)>(C(k)._t||0)){Object.assign(C(k),mrg(C(k),r));C(k)._t=r._t;lsSet(k,C(k));ch=true}}catch(e){}}

 if(a==='echk'||a==='edel'){const{L,i,key}=findEntry(b.dataset.src,id,UI.day);if(i<0)return;if(a==='echk')L[i].done=b.checked;else L.splice(i,1);save(key);render();return}
 if(a==='ics')return ics(b.dataset.src,id);
 if(a==='lchk'||a==='ldel'){const A=arr(b.dataset.k,b.dataset.path),i=A.findIndex(x=>x.id===id);if(i<0)return;if(a==='lchk')A[i].done=b.checked;else A.splice(i,1);save(b.dataset.k);render();return}
 if(a==='mood'){const D=mDay(UI.ldate),n=+b.dataset.n;D.mood=D.mood===n?null:n;save(mk(UI.ldate));render();return}
 if(a==='seltema'){UI.sel.tema=id;render();return}if(a==='sellect'){UI.sel.lect=id;render();return}

 if(a==='tdel'||a==='ldel2'){const p=a==='tdel'?'temas':'lect',L=arr('libreta',p),i=L.findIndex(x=>x.id===id);if(i<0)return;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='¿Seguro? toca otra vez';return}L.splice(i,1);save('libreta');render();return}
 if(a==='hab'){const H=C('habits'),h=b.dataset.h,ds=b.dataset.d;H.marks[h]=H.marks[h]||{};if(H.marks[h][ds])delete H.marks[h][ds];else H.marks[h][ds]=1;save('habits');render();return}
 if(a==='hdel'){const H=C('habits'),i=H.list.findIndex(x=>x.id===b.dataset.h);if(i>=0){H.list.splice(i,1);delete H.marks[b.dataset.h];save('habits');render()}return}
 const G=C('goals');G.list=G.list||[];const g=G.list.find(x=>x.id===id);
 if(a==='gnew'){const cs=['rosa','lila','cielo','salvia','mant'];G.list.push({id:uid(),title:'',c:cs[G.list.length%cs.length],steps:[]});save('goals');render().then(()=>{const t=document.querySelectorAll('.goal .gt');t.length&&t[t.length-1].focus()});return}
 if(a==='gdel'&&g){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.innerHTML='<span style="font-size:11px;color:var(--rosa)">¿borrar?</span>';b.style.width='auto';return}G.list.splice(G.list.indexOf(g),1);save('goals');render();return}
 if(a==='gstep'&&g){g.steps[+b.dataset.n].done=b.checked;save('goals');render();return}
 if(a==='photo'){$('#pick').click();return}
 if(a==='mode'){MODE=b.dataset.m||null;if(MODE!=='stk')SEL=null;tools();drawStk();document.querySelectorAll('.shbar [data-a=mode]').forEach(x=>x.classList.toggle('on',!!MODE&&x.dataset.m===MODE));if(MODE==='pen')toast('Modo lápiz: escribe sobre la hoja. Toca "Listo" para volver.');return}
 if(a==='hide'){const c=C('cfg');c.hide=!c.hide;save('cfg');tools();drawStk();return}
 if(a==='pc'){PEN.c=b.dataset.c;PEN.er=false;tools();return}if(a==='pw'){PEN.w=+b.dataset.n;PEN.er=false;tools();return}if(a==='per'){PEN.er=!PEN.er;tools();return}
 if(a==='pclear'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='¿Seguro? toca otra vez';return}const P=PG();P.k=[];save(pageKey());drawInk();tools();toast('Borré todo lo dibujado en esta hoja.');return}
 if(a==='goma'){MODE='pen';PEN.er=true;SEL=null;tools();drawStk();document.querySelectorAll('.shbar [data-a=mode]').forEach(x=>x.classList.remove('on'));toast('Goma: pásala por encima de lo que quieras borrar. Toca la X para terminar.');return}
 if(a==='pundo'){const P=PG();if(P.k.length){P.k.pop();save(pageKey());drawInk()}return}
 if(a==='sadd'){const[k,c]=LIB[+b.dataset.n];addSticker(k,c);return}
 const so=PG().s.find(x=>x.id===SEL);
 if(a==='frame'&&so){so.f=b.dataset.f;save(pageKey());drawStk();tools();return}
 if(a==='rot'&&so){so.r=((so.r||0)+10+180)%360-180;save(pageKey());drawStk();return}
 if(a==='front'&&so){const P=PG();P.s.push(P.s.splice(P.s.indexOf(so),1)[0]);save(pageKey());drawStk();return}
 if(a==='sz'&&so){so.z=Math.min(3,Math.max(.5,(so.z||1)+(+b.dataset.n)*.25));save(pageKey());drawStk();return}
 if(a==='sdel'&&so){if(so.a&&assets)assets.delete(so.a).catch(()=>{});const P=PG();P.s=P.s.filter(x=>x!==so);SEL=null;save(pageKey());drawStk();tools();return}

document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();const t=f.t.value.trim();if(!t){f.t.focus();return}
 if(k==='note'){const n=list('cuadernos').find(x=>x.id===UI.sel.nb);if(n){n.notes=n.notes||[];n.notes.unshift({id:uid(),t,ts:Date.now()});save('cuadernos')}}
 if(k==='add'){const sp=UI.sp;const o={id:uid(),t,time:f.time.value||'',done:false};
  if(sp==='deb'){list('deberes').push({...o,cat:'casa',date:UI.day});save('deberes')}else if(sp==='tra'){list('trabajo').push({...o,date:UI.day});save('trabajo')}else{mItems(UI.day).push({...o,sp:'lib'});save(mk(UI.day))}}
 if(k==='deb'){list('deberes').push({id:uid(),t,cat:UI.sub.deb,date:f.date.value||'',time:f.time.value||'',done:false});save('deberes')}
 if(k==='tra'){list('trabajo').push({id:uid(),t,date:TODAY,time:f.time.value||'',done:false});save('trabajo')}
 render().then(()=>{const x=document.querySelector(`form[data-f="${k}"] input[name=t]`);x&&x.focus()})});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.nurl){render();return}if(d.ed){const[src,id]=d.ed.split('|'),t=list(src).find(x=>x.id===id);if(t){t.date=e.target.value;save(src);render()}}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.k&&d.p){setPath(C(d.k),d.p,t.value);save(d.k);return}
 if(d.et){const[src,id]=d.et.split('|');const{L,i,key}=findEntry(src,id,UI.day);if(i>=0){L[i].t=t.value;save(key)}return}
 if(d.lt){const[k,p,id]=d.lt.split('|'),x=arr(k,p).find(z=>z.id===id);if(x){x.t=t.value;save(k)}return}
 if(d.tf){const[id,f]=d.tf.split('|'),x=arr('libreta','temas').find(z=>z.id===id);if(x){x[f]=t.value;save('libreta')}return}
 if(d.lf){const[id,f]=d.lf.split('|'),x=arr('libreta','lect').find(z=>z.id===id);if(x){x[f]=t.value;save('libreta')}return}
 if(d.ntt||d.nurl||d.ncit){const n=list('cuadernos').find(x=>x.id===UI.sel.nb);if(!n)return;if(d.ncit){const[id,i]=d.ncit.split('|'),o=n.notes.find(x=>x.id===id);if(o){o.items[+i].t=t.value;save('cuadernos')}return}const o=n.notes.find(x=>x.id===(d.ntt||d.nurl));if(o){if(d.ntt)o.title=t.value;else o.url=t.value;save('cuadernos')}return}
 if(d.nbf){const n=list('cuadernos').find(x=>x.id===d.nbf);if(n){n.name=t.value;save('cuadernos')}return}
 if(d.nt){const n=list('cuadernos').find(x=>x.id===UI.sel.nb),x=n&&(n.notes||[]).find(z=>z.id===d.nt);if(x){x.t=t.value;save('cuadernos')}return}
 if(d.hn){const h=C('habits').list.find(z=>z.id===d.hn);if(h){h.name=t.value;save('habits')}return}
 if(d.g){const[id,f]=d.g.split('|'),g=C('goals').list.find(z=>z.id===id);if(g){g[f]=t.value;save('goals')}return}
 if(d.gs){const[id,i]=d.gs.split('|'),g=C('goals').list.find(z=>z.id===id);if(g){g.steps[+i].t=t.value;save('goals')}return}
 if(d.cap){const s=PG().s.find(x=>x.id===SEL);if(s){s.cap=t.value;save(pageKey());const fc=document.querySelector(`[data-st="${SEL}"] figcaption`);if(fc)fc.textContent=t.value}return}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target,d=t.dataset,v=t.value&&t.value.trim();if(!(d.tadd||d.ladd||d.ladd2||d.tpadd||d.hadd||d.gadd||d.ncadd))return;e.preventDefault();if(!v)return;let sel='';
 if(d.ncadd){const n=list('cuadernos').find(x=>x.id===UI.sel.nb),o=n&&n.notes.find(x=>x.id===d.ncadd);if(o){o.items=o.items||[];o.items.push({t:v,done:false});save('cuadernos')}sel=`[data-ncadd="${d.ncadd}"]`}
 if(d.tadd){const o={id:uid(),t:v,st:'por investigar',notes:'',inv:''};arr('libreta','temas').push(o);UI.sel.tema=o.id;save('libreta');sel='[data-tadd]'}
 if(d.ladd){const o={id:uid(),title:v,author:'',frag:'',left:''};arr('libreta','lect').push(o);UI.sel.lect=o.id;save('libreta');sel='[data-ladd]'}
 if(d.ladd2){arr('libreta',d.ladd2).push({id:uid(),t:v,done:false});save('libreta');sel=`[data-ladd2="${d.ladd2}"]`}
 if(d.tpadd){list('trabajo').push({id:uid(),t:v,date:'',time:'',done:false});save('trabajo');sel='[data-tpadd]'}
 if(d.hadd){const H=C('habits');H.list=H.list||[];const cs=['rosa','lila','cielo','salvia','mant'];H.list.push({id:uid(),name:v,c:cs[H.list.length%cs.length]});save('habits');sel='[data-hadd]'}
 if(d.gadd){const g=C('goals').list.find(z=>z.id===d.gadd);if(g){g.steps=g.steps||[];g.steps.push({t:v,done:false});save('goals')}sel=`[data-gadd="${d.gadd}"]`}
 render().then(()=>{const x=document.querySelector(sel);x&&x.focus()})});

(function(){const CL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',CA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
 const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
 const lab=i=>{if(!i.value)return i.type==='time'?'hora':'fecha';if(i.type==='time')return i.value.slice(0,5);const[y,m,d]=i.value.split('-');return (+d)+' '+MES[+m-1]};
 const upd=i=>{const w=i.parentNode;if(!w||!w.classList||!w.classList.contains('tpick'))return;w.querySelector('span').textContent=lab(i);w.classList.toggle('has',!!i.value)};
 function wrap(root){(root.querySelectorAll?root:document).querySelectorAll('.addf input[type=time],.addf input[type=date]').forEach(i=>{if(i.parentNode.classList.contains('tpick'))return;const w=document.createElement('label');w.className='tpick';w.innerHTML=(i.type==='time'?CL:CA)+'<span></span>';i.removeAttribute('style');i.parentNode.insertBefore(w,i);w.appendChild(i);upd(i)})}
 document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.tpick input'))upd(e.target)},true);
 document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('.tpick input'))upd(e.target)},true);
 document.addEventListener('reset',e=>setTimeout(()=>e.target.querySelectorAll('.tpick input').forEach(upd)),true);
 new MutationObserver(()=>wrap(document)).observe(document.documentElement,{childList:true,subtree:true});wrap(document);
})();
